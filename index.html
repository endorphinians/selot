<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141a14">
<title>SELOT Arcade</title>
<link rel="canonical" href="./arcade/">
<meta http-equiv="refresh" content="0; url=./arcade/">
<style>
  :root { color-scheme: dark; --page: #141a14; --line: #3d493d; --text: #f7f1df; --muted: #c2c9b7; --lime: #d7ebaa; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-width: 280px; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font-family: system-ui, sans-serif; }
  .door { display: grid; justify-items: center; gap: 18px; padding: 32px 24px; text-align: center; }
  .mark { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 800; letter-spacing: .12em; }
  .mark span { color: var(--lime); font-size: 1.6rem; line-height: 1; }
  .mark em { color: var(--muted); font-style: normal; font-size: .72rem; font-weight: 600; }
  h1 { margin: 0; font: 400 clamp(2.6rem, 9vw, 5rem)/1 Georgia, serif; letter-spacing: -.04em; }
  p { margin: 0; max-width: 34ch; color: var(--muted); font-size: .9rem; line-height: 1.55; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 18px; border-radius: 6px; background: var(--lime); color: #212b18; font-weight: 750; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--lime); outline-offset: 4px; }
  .rule { width: 64px; height: 1px; background: var(--line); }
</style>
</head>
<body>
  <!-- The repository is a monorepo; the browser client lives in arcade/. This
       page is the entry point the preview server lands on, so it forwards
       straight to the client and keeps the fallback link for anyone whose
       browser blocks the automatic hop. -->
  <main class="door">
    <p class="mark"><span aria-hidden="true">✳</span> SELOT<em>ARCADE</em></p>
    <h1>The Arcade<span style="color: var(--lime)">.</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Three machines, one guest balance. Opening the reel room.</p>
    <a href="./arcade/">Enter the arcade</a>
  </main>
  <script>location.replace("./arcade/");</script>
<script defer src="/productos-badge.js"></script>
</body>
</html>
